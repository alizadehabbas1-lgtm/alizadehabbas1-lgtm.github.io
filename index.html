<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="خرجینه">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <title>💰 خرجینه</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #eef2f7;
            padding: 8px;
            padding-bottom: 90px;
            min-height: 100vh;
            direction: rtl;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 90vh;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            padding: 16px 18px;
            border-radius: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title h1 { font-size: 18px; margin: 0; }
        .header-title p { font-size: 10px; opacity: 0.9; margin-top: 3px; }
        .user-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-badge:active { background: rgba(255,255,255,0.3); }
        
        /* Offline */
        .offline-banner {
            background: #F59E0B;
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }
        .offline-banner.show { display: block; }
        
        /* Install */
        .install-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            display: none;
            box-shadow: 0 4px 15px rgba(243,156,18,0.4);
            font-family: inherit;
        }
        .install-btn.show { display: block; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        /* Summary */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            border-right: 4px solid #4F46E5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .summary-card.income { border-right-color: #10B981; }
        .summary-card.expense { border-right-color: #EF4444; }
        .summary-card.balance { border-right-color: #4F46E5; }
        .summary-card .icon { font-size: 20px; }
        .summary-card .label { font-size: 10px; color: #7f8c8d; margin-top: 2px; }
        .summary-card .value {
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 2px;
            direction: ltr;
        }
        .summary-card .value.negative { color: #EF4444; }
        
        /* Backup Bar */
        .backup-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .backup-bar button {
            flex: 1;
            min-width: 50px;
            padding: 8px 4px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .backup-bar .btn-backup { background: #3498db; color: white; }
        .backup-bar .btn-restore { background: #f39c12; color: white; }
        .backup-bar .btn-merge { background: #9b59b6; color: white; }
        .backup-bar .btn-clear { background: #e74c3c; color: white; }
        .backup-bar button:active { transform: scale(0.95); }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 12px;
            background: #f8f9fa;
            padding: 4px;
            border-radius: 12px;
        }
        .tab {
            flex: 1;
            padding: 8px 3px;
            text-align: center;
            border-radius: 8px;
            border: none;
            background: transparent;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
            color: #7f8c8d;
            font-family: inherit;
        }
        .tab.active {
            background: #4F46E5;
            color: white;
            box-shadow: 0 2px 8px rgba(79,70,229,0.3);
        }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Search */
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: #f8f9fa;
            font-family: inherit;
            margin-bottom: 12px;
        }
        .search-box input:focus {
            border-color: #4F46E5;
            outline: none;
            background: white;
        }
        
        /* Transaction List */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 500px;
            overflow-y: auto;
        }
        .transaction-item {
            background: white;
            padding: 10px 12px;
            border-radius: 12px;
            border-right: 4px solid #EF4444;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .transaction-item.income { border-right-color: #10B981; }
        .transaction-item .t-icon {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: #f8f9fa;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .transaction-item .t-info { flex: 1; min-width: 0; }
        .transaction-item .t-title {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .transaction-item .owner-tag {
            font-size: 9px;
            background: #EEF2FF;
            color: #4F46E5;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: bold;
        }
        .transaction-item .t-desc {
            font-size: 10px;
            color: #7f8c8d;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .transaction-item .t-amount {
            font-size: 13px;
            font-weight: bold;
            direction: ltr;
            color: #EF4444;
            flex-shrink: 0;
        }
        .transaction-item.income .t-amount { color: #10B981; }
        .transaction-item .t-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .transaction-item .t-actions button {
            padding: 4px 6px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            background: transparent;
        }
        .transaction-item .t-actions .edit-btn { color: #3498db; }
        .transaction-item .t-actions .delete-btn { color: #e74c3c; }
        
        /* Report */
        .report-section {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .report-section h3 {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ecf0f1;
        }
        .report-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .report-row:last-child { border-bottom: none; }
        .report-row .person-name {
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .report-row .amounts {
            display: flex;
            gap: 8px;
            direction: ltr;
            font-size: 11px;
        }
        .report-row .income-amt { color: #10B981; font-weight: bold; }
        .report-row .expense-amt { color: #EF4444; font-weight: bold; }
        .report-row .balance-amt {
            color: #4F46E5;
            font-weight: bold;
            padding: 1px 6px;
            background: #EEF2FF;
            border-radius: 6px;
        }
        
        .report-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .report-summary-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .report-summary-item .lbl { font-size: 10px; color: #7f8c8d; }
        .report-summary-item .val {
            font-size: 14px;
            font-weight: bold;
            margin-top: 3px;
            direction: ltr;
        }
        .report-summary-item.inc .val { color: #10B981; }
        .report-summary-item.exp .val { color: #EF4444; }
        .report-summary-item.bal .val { color: #4F46E5; }
        
        /* Empty */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #95a5a6;
            font-size: 14px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        
        /* FAB */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(79,70,229,0.5);
            z-index: 100;
            font-family: inherit;
        }
        .fab:active { transform: translateX(-50%) scale(0.95); }
        
        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(6px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #4F46E5;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-box .modal-header h2 {
            margin: 0;
            font-size: 17px;
            color: #2c3e50;
        }
        .modal-box .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            font-weight: bold;
            font-size: 13px;
            color: #34495e;
            display: block;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4F46E5;
            outline: none;
        }
        
        /* Type Toggle */
        .type-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }
        .type-option {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .type-option input { display: none; }
        .type-option.expense.selected {
            border-color: #EF4444;
            background: #FEF2F2;
            color: #EF4444;
        }
        .type-option.income.selected {
            border-color: #10B981;
            background: #F0FDF4;
            color: #10B981;
        }
        
        .amount-input {
            font-size: 20px !important;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            padding: 14px !important;
        }
        
        /* Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .btn-row button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-save { background: #4F46E5; color: white; }
        .btn-cancel { background: #95a5a6; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        
        /* Footer */
        .footer {
            text-align: center;
            font-size: 10px;
            color: #95a5a6;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #ecf0f1;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 9999;
            font-size: 13px;
            animation: slideUp 0.3s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
        
        @media (max-width: 400px) {
            .summary-card .value { font-size: 11px; }
            .tab { font-size: 9px; padding: 7px 2px; }
            .backup-bar button { font-size: 9px; padding: 7px 3px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="header-title">
            <h1>💰 خرجینه</h1>
            <p>مدیریت هزینه‌های خانگی</p>
        </div>
        <div class="user-badge" onclick="openUserModal()">
            👤 <span id="currentUser">-</span>
        </div>
    </div>
    
    <div class="offline-banner" id="offlineBanner">📴 حالت آفلاین</div>
    
    <button class="install-btn" id="installBtn" onclick="installApp()">📲 نصب اپ روی گوشی</button>
    
    <div class="summary-cards">
        <div class="summary-card income">
            <div class="icon">📈</div>
            <div class="label">درآمد ماه</div>
            <div class="value" id="summaryIncome">0</div>
        </div>
        <div class="summary-card expense">
            <div class="icon">📉</div>
            <div class="label">هزینه ماه</div>
            <div class="value" id="summaryExpense">0</div>
        </div>
        <div class="summary-card balance">
            <div class="icon">💎</div>
            <div class="label">مانده</div>
            <div class="value" id="summaryBalance">0</div>
        </div>
    </div>
    
    <div class="backup-bar">
        <button class="btn-backup" onclick="backupData()">💾 پشتیبان</button>
        <button class="btn-restore" onclick="document.getElementById('restoreInput').click()">📂 بازیابی</button>
        <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restoreData(event)">
        <button class="btn-merge" onclick="document.getElementById('mergeInput').click()">🔀 ادغام</button>
        <input type="file" id="mergeInput" accept=".json" style="display:none" onchange="mergeData(event)">
        <button class="btn-clear" onclick="clearAllData()">🗑️ پاک</button>
    </div>
    
    <div class="tabs">
        <button class="tab active" data-tab="all" onclick="switchTab('all')">📋 همه</button>
        <button class="tab" data-tab="income" onclick="switchTab('income')">💰 درآمد</button>
        <button class="tab" data-tab="expense" onclick="switchTab('expense')">💸 هزینه</button>
        <button class="tab" data-tab="report" onclick="switchTab('report')">📊 گزارش</button>
    </div>
    
    <div class="tab-content active" id="tab-all">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 جستجو..." oninput="renderTransactions()">
        </div>
        <div class="transaction-list" id="transactionList"></div>
    </div>
    
    <div class="tab-content" id="tab-income">
        <div class="search-box">
            <input type="text" id="searchInputIncome" placeholder="🔍 جستجوی درآمد..." oninput="renderTransactions()">
        </div>
        <div class="transaction-list" id="transactionListIncome"></div>
    </div>
    
    <div class="tab-content" id="tab-expense">
        <div class="search-box">
            <input type="text" id="searchInputExpense" placeholder="🔍 جستجوی هزینه..." oninput="renderTransactions()">
        </div>
        <div class="transaction-list" id="transactionListExpense"></div>
    </div>
    
    <div class="tab-content" id="tab-report">
        <div id="reportContainer"></div>
    </div>
    
    <div class="footer">💾 داده‌ها خودکار ذخیره می‌شن • PWA</div>
</div>

<button class="fab" onclick="openTransactionModal()">➕</button>

<!-- Modal تراکنش -->
<div class="modal-overlay" id="transactionModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modalTitle">➕ تراکنش جدید</h2>
            <button class="close-btn" onclick="closeTransactionModal()">✕</button>
        </div>
        
        <form id="transactionForm" onsubmit="saveTransaction(event)">
            <input type="hidden" id="editId" value="">
            
            <div class="type-toggle">
                <label class="type-option expense selected" id="typeExpense">
                    <input type="radio" name="type" value="expense" checked onchange="updateTypeToggle()">
                    <span>💸 هزینه</span>
                </label>
                <label class="type-option income" id="typeIncome">
                    <input type="radio" name="type" value="income" onchange="updateTypeToggle()">
                    <span>💰 درآمد</span>
                </label>
            </div>
            
            <div class="form-group">
                <label>مبلغ (تومان) *</label>
                <input type="number" id="amount" class="amount-input" placeholder="0" required>
            </div>
            
            <div class="form-group">
                <label>دسته‌بندی</label>
                <select id="category">
                    <option value="">— انتخاب کنید —</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>تاریخ (شمسی) *</label>
                <input type="text" id="date" placeholder="۱۴۰۳/۰۷/۰۹" required>
            </div>
            
            <div class="form-group">
                <label>توضیحات</label>
                <input type="text" id="description" placeholder="مثلاً: خرید از سوپرمارکت">
            </div>
            
            <div class="form-group">
                <label>👤 صاحب تراکنش</label>
                <input type="text" id="owner" placeholder="نام صاحب تراکنش">
            </div>
            
            <div class="btn-row">
                <button type="submit" class="btn-save">💾 ذخیره</button>
                <button type="button" class="btn-cancel" onclick="closeTransactionModal()">✕ انصراف</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal حذف -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>🗑️ حذف تراکنش</h2>
            <button class="close-btn" onclick="closeDeleteModal()">✕</button>
        </div>
        <div style="text-align:center;padding:10px 0;">
            <div style="font-size:48px;margin-bottom:10px;">⚠️</div>
            <h3 style="color:#2c3e50;">مطمئنی؟</h3>
            <p style="color:#7f8c8d;font-size:13px;margin:10px 0;">این عمل قابل بازگشت نیست.</p>
            <div class="btn-row">
                <button class="btn-delete" onclick="confirmDelete()">🗑️ حذف</button>
                <button class="btn-cancel" onclick="closeDeleteModal()">✕ انصراف</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal کاربر -->
<div class="modal-overlay" id="userModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>👤 نام کاربری</h2>
            <button class="close-btn" onclick="closeUserModal()">✕</button>
        </div>
        <div class="form-group">
            <label>نام شما (توی گزارش‌ها نمایش داده می‌شه)</label>
            <input type="text" id="userNameInput" placeholder="مثلاً: علی">
        </div>
        <div class="form-group">
            <label>نام دستگاه (اختیاری - برای اسم فایل پشتیبان)</label>
            <input type="text" id="deviceNameInput" placeholder="مثلاً: گوشی علی">
        </div>

const STORAGE_KEY = 'kharijineh_data_v2';
const CATEGORIES_KEY = 'kharijineh_categories_v2';

let transactions = [];
let categories = [];
let nextId = 1;
let currentTab = 'all';
let deleteTargetId = null;
let currentUser = '';
let deviceName = '';

const DEFAULT_CATEGORIES = [

    { id: 'transport', name: 'حمل‌ونقل', type: 'expense', icon: '🚕' },
    { id: 'bills', name: 'قبوض', type: 'expense', icon: '📄' },
    { id: 'medical', name: 'درمان', type: 'expense', icon: '💊' },
    { id: 'home', name: 'خانه', type: 'expense', icon: '🏠' },
    { id: 'fun', name: 'سرگرمی', type: 'expense', icon: '🎮' },
    { id: 'education', name: 'آموزش', type: 'expense', icon: '📚' },
    { id: 'other_expense', name: 'سایر هزینه‌ها', type: 'expense', icon: '💸' },
    { id: 'salary', name: 'حقوق', type: 'income', icon: '💼' },
    { id: 'sale', name: 'فروش', type: 'income', icon: '🛒' },
    { id: 'gift', name: 'هدیه', type: 'income', icon: '🎁' },
    { id: 'other_income', name: 'سایر درآمدها', type: 'income', icon: '💰' },
];

// ============================================================
//  تاریخ شمسی
// ============================================================
function gregorianToJalali(gy, gm, gd) {
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) +
               Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
    }
    const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
    return { jy, jm, jd };
}

function todayJalali() {
    const now = new Date();
    const { jy, jm, jd } = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
    return `${jy}/${String(jm).padStart(2, '0')}/${String(jd).padStart(2, '0')}`;
}

function todayJalaliForFile() {
    const now = new Date();
    const { jy, jm, jd } = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
    return `${jy}-${String(jm).padStart(2, '0')}-${String(jd).padStart(2, '0')}`;
}

function currentJalaliMonth() {
    const now = new Date();
    const { jy, jm } = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
    return `${jy}/${String(jm).padStart(2, '0')}`;
}

function toEnglishDigits(str) {
    if (!str) return '';
    const map = { '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
    return String(str).replace(/[۰-۹]/g, d => map[d]);
}

function formatAmount(amount) {
    const num = Math.abs(parseFloat(amount) || 0);
    return num.toLocaleString('en-US');
}

function generateUUID() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
    });
}

// ============================================================
//  بارگذاری
// ============================================================
function loadData() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            if (data.transactions) {
                transactions = data.transactions.map(t => {
                    if (!t.uuid) t.uuid = generateUUID();
                    if (!t.owner) t.owner = 'نامشخص';
                    return t;
                });
                nextId = data.nextId || 1;
            }
        }
        const savedCats = localStorage.getItem(CATEGORIES_KEY);
        categories = savedCats ? JSON.parse(savedCats) : [...DEFAULT_CATEGORIES];
        if (!savedCats) saveCategories();
        
        // کاربر
        const savedUser = localStorage.getItem(USER_KEY);
        if (savedUser) {
            const u = JSON.parse(savedUser);
            currentUser = u.name || '';
            deviceName = u.device || '';
        }
    } catch(e) {
        console.error('خطا:', e);
        categories = [...DEFAULT_CATEGORIES];
    }
}

function saveData() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ transactions, nextId }));
        return true;
    } catch(e) {
        showToast('❌ خطا در ذخیره', 'error');
        return false;
    }
}

function saveCategories() {
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
}

function saveUserData() {
    localStorage.setItem(USER_KEY, JSON.stringify({ name: currentUser, device: deviceName }));
}

// ============================================================
//  رندر
// ============================================================
function renderTransactions() {
    // تب فعلی
    let listId = 'transactionList';
    let searchId = 'searchInput';
    if (currentTab === 'income') { listId = 'transactionListIncome'; searchId = 'searchInputIncome'; }
    else if (currentTab === 'expense') { listId = 'transactionListExpense'; searchId = 'searchInputExpense'; }
    
    const container = document.getElementById(listId);
    if (!container) return;
    
    const search = (document.getElementById(searchId)?.value || '').trim().toLowerCase();
    
    let filtered = transactions;
    
    if (currentTab === 'income') filtered = filtered.filter(t => t.type === 'income');
    else if (currentTab === 'expense') filtered = filtered.filter(t => t.type === 'expense');
    
    if (search) {
        filtered = filtered.filter(t => {
            const cat = categories.find(c => c.id === t.category);
            const catName = cat ? cat.name.toLowerCase() : '';
            const desc = (t.description || '').toLowerCase();
            const owner = (t.owner || '').toLowerCase();
            return catName.includes(search) || desc.includes(search) || owner.includes(search) || String(t.amount).includes(search);
        });
    }
    
    filtered.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
    
    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">📝</div><div>هنوز تراکنشی ثبت نشده</div></div>`;
        return;
    }
    
    container.innerHTML = filtered.map(t => {
        const cat = categories.find(c => c.id === t.category);
        const icon = cat ? cat.icon : (t.type === 'income' ? '💰' : '💸');
        const title = cat ? cat.name : 'بدون دسته';
        const sign = t.type === 'income' ? '+' : '-';
        const itemClass = t.type === 'income' ? 'income' : '';
        const ownerTag = t.owner && t.owner !== 'نامشخص' ? `<span class="owner-tag">👤 ${t.owner}</span>` : '';
        
        return `
            <div class="transaction-item ${itemClass}">
                <div class="t-icon">${icon}</div>
                <div class="t-info">
                    <div class="t-title">${title} ${ownerTag}</div>
                    <div class="t-desc">${t.date}${t.description ? ' - ' + t.description : ''}</div>
                </div>
                <div class="t-amount">${sign}${formatAmount(t.amount)}</div>
                <div class="t-actions">
                    <button class="edit-btn" onclick="editTransaction(${t.id})">✏️</button>
                    <button class="delete-btn" onclick="openDeleteModal(${t.id})">🗑️</button>
                </div>
            </div>
        `;
    }).join('');
}

function updateSummary() {
    const currentMonth = currentJalaliMonth();
    let income = 0, expense = 0;
    
    transactions.forEach(t => {
        if (t.date && t.date.startsWith(currentMonth)) {
            if (t.type === 'income') income += parseFloat(t.amount) || 0;
            else expense += parseFloat(t.amount) || 0;
        }
    });
    
    const balance = income - expense;
    
    document.getElementById('summaryIncome').textContent = formatAmount(income);
    document.getElementById('summaryExpense').textContent = formatAmount(expense);
    const balEl = document.getElementById('summaryBalance');
    balEl.textContent = formatAmount(balance);
    balEl.classList.toggle('negative', balance < 0);
}

// ============================================================
//  گزارش
// ============================================================
function renderReport() {
    const container = document.getElementById('reportContainer');
    if (!container) return;
    
    if (transactions.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">📊</div><div>هنوز داده‌ای برای گزارش نیست</div></div>`;
        return;
    }
    
    // جمع کل
    let totalIncome = 0, totalExpense = 0;
    const byPerson = {}; // { name: { income, expense, count } }
    const byCategory = {}; // { catId: total }
    
    transactions.forEach(t => {
        const amt = parseFloat(t.amount) || 0;
        const owner = t.owner || 'نامشخص';
        
        if (!byPerson[owner]) byPerson[owner] = { income: 0, expense: 0, count: 0 };
        byPerson[owner].count++;
        
        if (t.type === 'income') {
            totalIncome += amt;
            byPerson[owner].income += amt;
        } else {
            totalExpense += amt;
            byPerson[owner].expense += amt;
        }
        
        if (t.category) {
            if (!byCategory[t.category]) byCategory[t.category] = 0;
            byCategory[t.category] += amt;
        }
    });
    
    const totalBalance = totalIncome - totalExpense;
    
    // مرتب‌سازی افراد
    const personsSorted = Object.entries(byPerson).sort((a, b) => 
        (b[1].income + b[1].expense) - (a[1].income + a[1].expense)
    );
    
    // مرتب‌سازی دسته‌بندی‌ها
    const categoriesSorted = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
    
    let html = '';
    
    // خلاصه کل
    html += `
        <div class="report-summary">
            <div class="report-summary-item inc">
                <div class="lbl">📈 کل درآمد</div>
                <div class="val">${formatAmount(totalIncome)}</div>
            </div>
            <div class="report-summary-item exp">
                <div class="lbl">📉 کل هزینه</div>
                <div class="val">${formatAmount(totalExpense)}</div>
            </div>
            <div class="report-summary-item bal">
                <div class="lbl">💎 مانده</div>
                <div class="val">${formatAmount(totalBalance)}</div>
            </div>
        </div>
    `;
    
    // گزارش به تفکیک افراد
    html += `
        <div class="report-section">
            <h3>👥 گزارش به تفکیک افراد (${personsSorted.length} نفر)</h3>
    `;
    
    personsSorted.forEach(([name, data]) => {
        const balance = data.income - data.expense;
        html += `
            <div class="report-row">
                <div class="person-name">👤 ${name} <span style="font-size:10px;color:#95a5a6;">(${data.count} تراکنش)</span></div>
                <div class="amounts">
                    <span class="income-amt">+${formatAmount(data.income)}</span>
                    <span class="expense-amt">-${formatAmount(data.expense)}</span>
                    <span class="balance-amt">${formatAmount(balance)}</span>
                </div>
            </div>
        `;
    });
    
    html += `</div>`;
    
    // گزارش به تفکیک دسته‌بندی
    html += `
        <div class="report-section">
            <h3>📂 گزارش به تفکیک دسته‌بندی</h3>
    `;
    
    categoriesSorted.forEach(([catId, total]) => {
        const cat = categories.find(c => c.id === catId);
        if (!cat) return;
        html += `
            <div class="report-row">
                <div class="person-name">${cat.icon} ${cat.name}</div>
                <div class="amounts">
                    <span class="expense-amt">${formatAmount(total)}</span>
                </div>
            </div>
        `;
    });
    
    html += `</div>`;
    
    container.innerHTML = html;
}

// ============================================================
//  تب‌ها
// ============================================================
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    
    if (tab === 'report') {
        renderReport();
    } else {
        renderTransactions();
    }
}

// ============================================================
//  Modal تراکنش
// ============================================================
function openTransactionModal(editId = null) {
    const modal = document.getElementById('transactionModal');
    const title = document.getElementById('modalTitle');
    const form = document.getElementById('transactionForm');
    const editIdInput = document.getElementById('editId');
    
    form.reset();
    document.getElementById('date').value = todayJalali();
    document.getElementById('owner').value = currentUser || '';
    
    if (editId) {
        const t = transactions.find(x => x.id === editId);
        if (!t) { showToast('❌ پیدا نشد', 'error'); return; }
        
        title.textContent = '✏️ ویرایش تراکنش';
        editIdInput.value = editId;
        document.getElementById('amount').value = t.amount;
        document.getElementById('date').value = t.date;
        document.getElementById('description').value = t.description || '';
        document.getElementById('owner').value = t.owner || '';
        
        const radio = document.querySelector(`input[name="type"][value="${t.type}"]`);
        if (radio) radio.checked = true;
        
        updateTypeToggle();
        document.getElementById('category').value = t.category || '';
    } else {
        title.textContent = '➕ تراکنش جدید';
        editIdInput.value = '';
        document.querySelector('input[name="type"][value="expense"]').checked = true;
        updateTypeToggle();
    }
    
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('amount').focus(), 200);
}

function closeTransactionModal() {
    document.getElementById('transactionModal').classList.remove('active');
    document.body.style.overflow = '';
}

function updateTypeToggle() {
    const type = document.querySelector('input[name="type"]:checked')?.value || 'expense';
    document.getElementById('typeExpense').classList.toggle('selected', type === 'expense');
    document.getElementById('typeIncome').classList.toggle('selected', type === 'income');
    populateCategoryDropdown(type);
}

function populateCategoryDropdown(type) {
    const select = document.getElementById('category');
    const currentValue = select.value;
    const filtered = categories.filter(c => c.type === type);
    select.innerHTML = '<option value="">— انتخاب کنید —</option>' +
        filtered.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
    if (currentValue) select.value = currentValue;
}

function saveTransaction(event) {
    event.preventDefault();
    
    const editId = document.getElementById('editId').value;
    const type = document.querySelector('input[name="type"]:checked').value;
    const amount = parseFloat(toEnglishDigits(document.getElementById('amount').value)) || 0;
    let date = toEnglishDigits(document.getElementById('date').value.trim());
    const description = document.getElementById('description').value.trim();
    const category = document.getElementById('category').value;
    const owner = document.getElementById('owner').value.trim() || currentUser || 'نامشخص';
    
    if (!amount || amount <= 0) { showToast('❌ مبلغ را وارد کنید', 'error'); return; }
    if (!date) { showToast('❌ تاریخ را وارد کنید', 'error'); return; }
    
    const parts = date.split('/');
    if (parts.length === 3) {
        date = `${parts[0]}/${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}`;
    }
    
    if (editId) {
        const t = transactions.find(x => x.id === parseInt(editId));
        if (t) {
            t.type = type; t.amount = amount; t.date = date;
            t.description = description; t.category = category; t.owner = owner;
            t.updatedAt = new Date().toISOString();
            showToast('✅ ویرایش شد', 'success');
        }
    } else {
        transactions.push({
            id: nextId++,
            uuid: generateUUID(),
            type, amount, date, description, category, owner,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
        });
        showToast('✅ ذخیره شد', 'success');
    }
    
    saveData();
    renderTransactions();
    updateSummary();
    closeTransactionModal();
}

function editTransaction(id) {
    openTransactionModal(id);
}

// ============================================================
//  حذف
// ============================================================
function openDeleteModal(id) {
    deleteTargetId = id;
    document.getElementById('deleteModal').classList.add('active');
}
function closeDeleteModal() {
    deleteTargetId = null;
    document.getElementById('deleteModal').classList.remove('active');
}
function confirmDelete() {
    if (!deleteTargetId) return;
    const idx = transactions.findIndex(t => t.id === deleteTargetId);
    if (idx >= 0) {
        transactions.splice(idx, 1);
        saveData();
        renderTransactions();
        updateSummary();
        showToast('🗑️ حذف شد', 'info');
    }
    closeDeleteModal();
}

// ============================================================
//  کاربر
// ============================================================
function openUserModal() {
    document.getElementById('userNameInput').value = currentUser || '';
    document.getElementById('deviceNameInput').value = deviceName || '';
    document.getElementById('userModal').classList.add('active');
}
function closeUserModal() {
    document.getElementById('userModal').classList.remove('active');
}
function saveUser() {
    const name = document.getElementById('userNameInput').value.trim();
    const device = document.getElementById('deviceNameInput').value.trim();
    
    if (!name) { showToast('❌ نام را وارد کنید', 'error'); return; }
    
    currentUser = name;
    deviceName = device;
    saveUserData();
    updateUserBadge();
    closeUserModal();
    showToast(`✅ خوش آمدی ${name}!`, 'success');
}

function updateUserBadge() {
    const el = document.getElementById('currentUser');
    if (el) el.textContent = currentUser || 'تنظیم';
}

// ============================================================
//  پشتیبان
// ============================================================
function backupData() {
    if (transactions.length === 0) {
        showToast('⚠️ داده‌ای وجود ندارد', 'error');
        return;
    }
    
    const data = {
        transactions, categories, nextId,
        backupDate: new Date().toISOString(),
        backupDateJalali: todayJalali(),
        backupBy: currentUser || 'نامشخص',
        device: deviceName || 'نامشخص',
        app: 'kharijineh', version: 2,
    };
    
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    
    // اسم فایل: kharijineh_علی_گوشی-علی_1403-07-09.json
    const parts = ['kharijineh'];
    if (currentUser) parts.push(currentUser.replace(/\s+/g, '-'));
    if (deviceName) parts.push(deviceName.replace(/\s+/g, '-'));
    parts.push(todayJalaliForFile());
    
    a.download = parts.join('_') + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast(`✅ پشتیبان ذخیره شد (${transactions.length} تراکنش)`, 'success');
}

function restoreData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.transactions || data.transactions.length === 0) {
                showToast('❌ فایل نامعتبر', 'error'); return;
            }
            
            if (confirm(`⚠️ ${data.transactions.length} تراکنش جایگزین شود؟`)) {
                transactions = data.transactions.map(t => {
                    if (!t.uuid) t.uuid = generateUUID();
                    if (!t.owner) t.owner = 'نامشخص';
                    return t;
                });
                nextId = data.nextId || Math.max(...transactions.map(t => t.id), 0) + 1;
                if (data.categories) { categories = data.categories; saveCategories(); }
                saveData();
                renderTransactions();
                updateSummary();
                showToast(`✅ ${data.transactions.length} تراکنش بازیابی شد`, 'success');
            }
        } catch(err) {
            showToast('❌ خطا: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function clearAllData() {
    if (transactions.length === 0) { showToast('⚠️ خالی است', 'error'); return; }
    if (confirm(`⚠️ همه‌ی ${transactions.length} تراکنش پاک شود؟`)) {
        transactions = [];
        nextId = 1;
        saveData();
        renderTransactions();
        updateSummary();
        showToast('🗑️ پاک شد', 'info');
    }
}

// ============================================================
//  ادغام
// ============================================================
function mergeData(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (!importedData.transactions || importedData.transactions.length === 0) {
                showToast('❌ فایل نامعتبر', 'error'); return;
            }
            
            const imported = importedData.transactions.map(t => {
                if (!t.uuid) t.uuid = generateUUID();
                if (!t.owner) t.owner = importedData.backupBy || 'نامشخص';
                return t;
            });
            
            const analysis = analyzeMerge(imported);
            showMergePreview(analysis, imported, importedData);
        } catch(err) {
            showToast('❌ خطا: ' + err.message, 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function analyzeMerge(imported) {
    const newItems = [], updateItems = [], duplicates = [];
    
    imported.forEach(imp => {
        const existing = transactions.find(t => t.uuid === imp.uuid);
        if (!existing) {
            newItems.push(imp);
        } else {
            const impTime = new Date(imp.updatedAt || imp.createdAt || 0).getTime();
            const exTime = new Date(existing.updatedAt || existing.createdAt || 0).getTime();
            if (impTime > exTime) updateItems.push({ existing, imported: imp });
            else duplicates.push(imp);
        }
    });
    
    return { newItems, updateItems, duplicates };
}

function showMergePreview(analysis, imported, importedData) {
    const { newItems, updateItems, duplicates } = analysis;
    
    // گروه‌بندی بر اساس owner
    const byOwner = {};
    newItems.forEach(t => {
        const o = t.owner || 'نامشخص';
        if (!byOwner[o]) byOwner[o] = 0;
        byOwner[o]++;
    });
    
    let ownerHtml = '';
    const ownerEntries = Object.entries(byOwner);
    if (ownerEntries.length > 0) {
        ownerHtml = `
            <div style="background:#EEF2FF;border-radius:10px;padding:10px;margin-bottom:10px;">
                <div style="font-size:12px;font-weight:bold;color:#4F46E5;margin-bottom:6px;">
                    👥 تراکنش‌های جدید به تفکیک افراد:
                </div>
                ${ownerEntries.map(([name, count]) => `
                    <div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px;">
                        <span>👤 ${name}</span>
                        <strong>${count} تراکنش</strong>
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    const fromInfo = importedData.backupBy ? 
        `<div style="background:#FEF3C7;border-radius:8px;padding:8px;margin-bottom:10px;font-size:12px;">
            📦 این فایل از طرف: <strong>${importedData.backupBy}</strong>
            ${importedData.device ? ' - دستگاه: <strong>' + importedData.device + '</strong>' : ''}
            ${importedData.backupDateJalali ? '<br>📅 تاریخ: ' + importedData.backupDateJalali : ''}
        </div>` : '';
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay active';
    modal.id = 'mergeModal';
    modal.innerHTML = `
        <div class="modal-box" style="max-width:500px;">
            <div class="modal-header">
                <h2>🔀 ادغام داده‌ها</h2>
                <button class="close-btn" onclick="closeMergeModal()">✕</button>
            </div>
            
            ${fromInfo}
            
            <div style="background:#f8f9fa;border-radius:12px;padding:12px;margin-bottom:12px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
                    <div style="background:white;border-radius:8px;padding:10px;text-align:center;">
                        <div style="font-size:10px;color:#7f8c8d;">داده‌های فعلی</div>
                        <div style="font-size:18px;font-weight:bold;color:#3498db;">${transactions.length}</div>
                    </div>
                    <div style="background:white;border-radius:8px;padding:10px;text-align:center;">
                        <div style="font-size:10px;color:#7f8c8d;">داده‌های فایل</div>
                        <div style="font-size:18px;font-weight:bold;color:#9b59b6;">${imported.length}</div>
                    </div>
                </div>
                <div style="background:white;border-radius:8px;padding:10px;">
                    <div style="display:flex;justify-content:space-between;padding:4px 0;">
                        <span style="font-size:12px;">🆕 جدید:</span>
                        <strong style="color:#27ae60;">${newItems.length}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:4px 0;">
                        <span style="font-size:12px;">✏️ به‌روزرسانی:</span>
                        <strong style="color:#f39c12;">${updateItems.length}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:4px 0;">
                        <span style="font-size:12px;">👥 تکراری:</span>
                        <strong style="color:#95a5a6;">${duplicates.length}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px;font-weight:bold;border-top:2px solid #ecf0f1;margin-top:6px;">
                        <span>📊 مجموع بعد از ادغام:</span>
                        <strong style="color:#4F46E5;">${transactions.length + newItems.length}</strong>
                    </div>
                </div>
            </div>
            
            ${ownerHtml}
            
            <div class="btn-row">
                <button onclick="confirmMerge()" style="background:#4F46E5;color:white;">🔀 ادغام کن</button>
                <button onclick="closeMergeModal()" style="background:#95a5a6;color:white;">✕ انصراف</button>
            </div>
        </div>
    `;
    
    document.body.appendChild(modal);
    window.pendingImportData = imported;
    window.pendingAnalysis = analysis;
}

function closeMergeModal() {
    document.getElementById('mergeModal')?.remove();
    window.pendingImportData = null;
    window.pendingAnalysis = null;
}

function confirmMerge() {
    const imported = window.pendingImportData;
    const analysis = window.pendingAnalysis;
    if (!imported || !analysis) return;
    
    localStorage.setItem('kharijineh_auto_backup_' + Date.now(), 
        JSON.stringify({ transactions, nextId }));
    
    let added = 0, updated = 0;
    
    analysis.newItems.forEach(t => {
        if (!t.uuid) t.uuid = generateUUID();
        if (!t.id) t.id = nextId++;
        else if (t.id >= nextId) nextId = t.id + 1;
        transactions.push(t);
        added++;
    });
    
    analysis.updateItems.forEach(({ existing, imported }) => {
        Object.assign(existing, imported);
        updated++;
    });
    
    saveData();
    renderTransactions();
    updateSummary();
    closeMergeModal();
    setTimeout(() => showMergeResult(added, updated, analysis.duplicates.length), 200);
}

function showMergeResult(added, updated, duplicates) {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay active';
    modal.id = 'mergeResultModal';
    modal.innerHTML = `
        <div class="modal-box" style="max-width:400px;">
            <div class="modal-header">
                <h2>✅ ادغام انجام شد</h2>
                <button class="close-btn" onclick="document.getElementById('mergeResultModal').remove()">✕</button>
            </div>
            <div style="text-align:center;padding:16px 0;">
                <div style="font-size:50px;margin-bottom:12px;">🎉</div>
                <div style="background:#f8f9fa;border-radius:12px;padding:14px;text-align:right;">
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ecf0f1;">
                        <span>🆕 اضافه شده:</span><strong style="color:#27ae60;">${added}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ecf0f1;">
                        <span>✏️ به‌روزرسانی:</span><strong style="color:#3498db;">${updated}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ecf0f1;">
                        <span>👥 تکراری:</span><strong style="color:#95a5a6;">${duplicates}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:bold;">
                        <span>📊 مجموع:</span><strong style="color:#4F46E5;">${transactions.length}</strong>
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button onclick="document.getElementById('mergeResultModal').remove()" style="background:#4F46E5;color:white;width:100%;">✅ بستن</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
}

// ============================================================
//  Toast
// ============================================================
function showToast(message, type = 'info') {
    document.querySelector('.toast')?.remove();
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.5s';
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}
